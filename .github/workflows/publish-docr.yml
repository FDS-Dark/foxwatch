name: Publish to DOCR and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: registry.digitalocean.com/${{ secrets.DOCR_REGISTRY_NAME }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Build and push API image
        run: |
          docker build -f api/Dockerfile \
            -t "${REGISTRY}/foxwatch-api:${GITHUB_SHA}" \
            -t "${REGISTRY}/foxwatch-api:latest" \
            .
          docker push "${REGISTRY}/foxwatch-api:${GITHUB_SHA}"
          docker push "${REGISTRY}/foxwatch-api:latest"

      - name: Build and push web image
        run: |
          docker build -f client/Dockerfile \
            -t "${REGISTRY}/foxwatch-web:${GITHUB_SHA}" \
            -t "${REGISTRY}/foxwatch-web:latest" \
            .
          docker push "${REGISTRY}/foxwatch-web:${GITHUB_SHA}"
          docker push "${REGISTRY}/foxwatch-web:latest"

      - name: Trigger App Platform deployment
        env:
          DO_APP_ID: ${{ secrets.DO_APP_ID }}
        if: env.DO_APP_ID != ''
        run: doctl apps create-deployment "$DO_APP_ID"
