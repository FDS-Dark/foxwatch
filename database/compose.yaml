services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: foxwatch-postgres
    restart: unless-stopped
    command: postgres -c hba_file=/etc/postgresql/pg_hba.conf
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
      - ./docker/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  dbup-executor:
    image: registry.gitlab.com/austinkoske/utils/db-upgrader:latest
    container_name: foxwatch-dbup
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts:ro
      - ./appsettings.json:/app/appsettings.json:ro
    environment:
      AppSettings__Postgres__Host: postgres
      AppSettings__Postgres__Port: 5432
      AppSettings__Postgres__Username: dbup_local
      AppSettings__Postgres__Password: dbup_local
      AppSettings__Postgres__Database: foxwatch
      AppSettings__DBUp__ScriptsDirectoryPath: /scripts
      AppSettings__Local: "true"
